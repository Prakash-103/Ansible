---
- name: Collect Interface Details and Save to a Single File
  hosts: cisco9300
  gather_facts: no

  tasks:
    - name: sh commands using the prompt and answer must be in the string ''
      cisco.ios.ios_command:
        commands:
          - command: clear counter gi 0/0
            prompt: 'Clear "show interface" counters on this interface \[confirm\]'
            answer: 'y'
      register: clear_counter
    
    - name: print output of clear counter
      ansible.builtin.debug:
        msg: "{{clear_counter}}"

    - name: sh commands
      cisco.ios.ios_command:
        commands:
          - command: sh int gi 0/0
      register: sh_int_output

    - name: print output of clear counter
      ansible.builtin.debug:
        msg: "{{sh_int_output}}"
