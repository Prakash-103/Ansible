---
- name: Configure OSPFv2 on Arista switch
  hosts: switches
  gather_facts: false
  become: yes
  vars:
    ospf_interfaces:
      - Ethernet1
      - Ethernet2
      - Ethernet3
      - Ethernet4
      - Ethernet5
      - Ethernet6

  tasks:
    - name: Configure OSPFv2 on the switch
      arista.eos.eos_ospfv2:
        config:
          processes:
            - process_id: 1
              networks:
                - area: 0
                  prefix: "192.168.1.0/24"
                - area: 0
                  prefix: "192.168.2.0/24"
              passive_interface:
                default: true
        state: merged

    - name: Enable OSPFv2 on specific interfaces
      arista.eos.eos_ospf_interfaces:
        config:
          - name: "{{ item }}"
            area: 0
            passive_interface: false
        loop: "{{ ospf_interfaces }}"
        state: merged
