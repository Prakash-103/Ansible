---
- name: parsing the configurations
  hosts: cisco9300
  gather_facts: no
  tasks:  
    - name: Configure the nested parents
      cisco.ios.ios_config:
        lines:
          - record rc
          - logging enable
        parents: 
          - archive
          - log config
      register: archive_output

    - name: Configure the multiple nested parents
      cisco.ios.ios_config:
        lines:
          - "path scp:"
        parents: archive
      register: archive_output

    - name: print the output
      ansible.builtin.debug:
          msg: "{{archive_output}}"